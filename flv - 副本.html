<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器 + 半透明摄像头叠加</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 播放器容器，作为定位基准 */
        .video-container {
            position: relative;
            width: 800px;
            max-width: 90%;
            aspect-ratio: 16 / 9;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        /* 底层的主视频播放器 */
        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 顶层叠加的摄像头窗口 */
        .camera-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 720px;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            
            /* 核心样式：设置半透明度 */
            opacity: 0.6; 
            
            /* 镜像翻转：符合自拍习惯 */
            transform: scaleX(-1); 
            
            /* 可选：使得鼠标点击可以穿透摄像头，直接操作底部的视频 */
            pointer-events: none; 
            
            transition: opacity 0.3s ease;
        }

        /* 鼠标悬停在容器上时，摄像头变得更透明，减少视觉干扰 */
        .video-container:hover .camera-overlay {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 1. 底层网页视频（请自行替换有效视频源链接） -->
        <video class="main-video" controls autoplay loop muted>
            <source src="https://googleapis.com" type="video/mp4">
            您的浏览器不支持 HTML5 视频播放。
        </video>

        <!-- 2. 顶层叠加的摄像头视频图层 -->
        <video id="webcam" class="camera-overlay" autoplay playsinline></video>
    </div>

    <script>
        async function initCamera() {
            const webcamElement = document.getElementById('webcam');
            
            try {
                // 请求调取摄像头权限（仅音频设为 false）
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: false 
                });
                
                // 将摄像头视频流绑定到外层 video 标签
                webcamElement.srcObject = stream;
            } catch (error) {
                console.error("无法获取摄像头权限:", error);
                alert("摄像头获取失败，请确保已授予网页摄像头权限，且使用的是 HTTPS 环境或 localhost。");
            }
        }

        // 页面加载完成后自动启动摄像头
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
