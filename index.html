<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>合唱指挥学习辅助播放器</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0069d9;
            --bg-color: #121212;
            --panel-bg: rgba(24, 26, 32, 0.82);
            --btn-bg: rgba(255, 255, 255, 0.10);
            --btn-bg-hover: rgba(255, 255, 255, 0.18);
            --btn-active: #007bff;
            --btn-danger: #dc3545;
            --border-color: rgba(255, 255, 255, 0.14);
            --text-color: #e8eaed;
            --text-dim: #9aa0a6;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        /* 顶部控制栏（两行布局，移动端自适应） */
        #control-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 12px;
            padding-top: calc(8px + env(safe-area-inset-top));
            box-sizing: border-box;
            z-index: 9999;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #video-url-input {
            flex: 1;
            min-width: 140px;
            height: 36px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #video-url-input:focus { border-color: var(--primary-color); }
        #video-url-input::placeholder { color: var(--text-dim); }

        .btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .btn:hover { background: var(--btn-bg-hover); }
        .btn:active { transform: scale(0.97); }

        .btn.primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            font-weight: 600;
        }
        .btn.primary:hover { background: var(--primary-hover); }

        /* 开关型按钮的激活态 */
        .btn.active {
            background: var(--btn-active);
            border-color: var(--btn-active);
            color: #fff;
        }
        .btn.active.danger {
            background: var(--btn-danger);
            border-color: var(--btn-danger);
        }

        /* 主视频播放区域（铺满全屏，控制栏悬浮于其上） */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .video-mirror {
            transform: scaleX(-1);
        }

        /* 嵌入播放器容器 */
        #embed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
            z-index: 1;
        }

        #embed-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* 可拖拽缩放的摄像头图层 */
        #camera-wrapper {
            position: absolute;
            top: 15%;
            left: 8%;
            width: 320px;
            height: 240px;
            max-width: 80vw;
            min-width: 120px;
            min-height: 90px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            z-index: 999;
            display: none; /* 默认隐藏 */
            cursor: move;
            touch-action: none; /* 关键：阻止页面滚动，让指针事件接管拖拽 */
        }

        /* 摄像头视频流，设置半透明度 */
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6; /* 半透明叠加效果 */
            pointer-events: none; /* 防止干扰拖拽 */
        }

        .camera-mirror {
            transform: scaleX(-1);
        }

        /* 缩放手柄（触屏上加大点击区域） */
        #resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, transparent 45%, rgba(255,255,255,0.75) 45%);
            cursor: se-resize;
            border-radius: 0 0 10px 0;
            z-index: 1001;
            touch-action: none;
        }

        /* 可拖拽的悬浮 PNG 图片图层 */
        #image-wrapper {
            position: absolute;
            top: 20%;
            left: 45%;
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.45);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            z-index: 998;
            display: none; /* 默认隐藏 */
            cursor: move;
            touch-action: none;
        }

        #overlay-image {
            display: block;
            max-width: 400px;
            max-height: 300px;
            max-width: 70vw;
            pointer-events: none; /* 防止干扰拖拽 */
        }

        .image-mirror {
            transform: scaleX(-1);
        }

        /* 拖放本地视频文件的提示遮罩 */
        #drop-overlay {
            position: absolute;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 20, 50, 0.75);
            border: 3px dashed var(--primary-color);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: #fff;
            font-size: 20px;
            pointer-events: none;
        }

        #drop-overlay .drop-icon { font-size: 52px; }

        /* 轻提示 Toast */
        #toast {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 10001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            max-width: 86vw;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .btn {
                padding: 8px 10px;
                font-size: 12px;
            }
            #video-url-input {
                height: 34px;
                font-size: 13px;
            }
            #camera-wrapper {
                width: 220px;
                height: 165px;
            }
        }

        @media (max-width: 480px) {
            #control-bar { padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top)); gap: 6px; }
            .bar-row { gap: 6px; }
            .btn { padding: 7px 8px; font-size: 11px; }
            #video-url-input { min-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 顶部控制栏 -->
    <div id="control-bar">
        <!-- 第一行：地址输入 + 主要操作 -->
        <div class="bar-row">
            <input type="text" id="video-url-input"
                   placeholder="粘贴 YouTube / Bilibili / MP4 / HLS 链接"
                   autocomplete="off">
            <button class="btn primary" id="load-video-btn">生成播放器</button>
            <button class="btn" id="local-file-btn">本地视频</button>
            <button class="btn" id="fullscreen-btn" title="全屏">⛶ 全屏</button>
        </div>
        <!-- 第二行：图层开关与镜像 -->
        <div class="bar-row">
            <button class="btn" id="toggle-camera-btn">📷 摄像头</button>
            <button class="btn" id="toggle-image-btn">🖼 上传图片</button>
            <button class="btn" id="mirror-video-btn">视频镜像</button>
            <button class="btn" id="mirror-camera-btn">摄像头镜像</button>
            <button class="btn" id="mirror-image-btn">图片镜像</button>
        </div>
    </div>

    <!-- 播放器核心容器 -->
    <div id="video-container">
        <!-- 主视频（playsinline 保证 iOS 内联播放） -->
        <video id="main-video" controls autoplay loop playsinline webkit-playsinline></video>

        <!-- 嵌入播放器容器：YouTube / Bilibili / Vimeo 等 -->
        <div id="embed-container"></div>

        <!-- 悬浮摄像头图层 -->
        <div id="camera-wrapper">
            <video id="camera-video" autoplay playsinline muted webkit-playsinline></video>
            <div id="resize-handle"></div>
        </div>

        <!-- 悬浮 PNG 图片图层 -->
        <div id="image-wrapper">
            <img id="overlay-image" alt="悬浮图片">
        </div>
    </div>

    <!-- 拖放本地视频提示遮罩 -->
    <div id="drop-overlay">
        <div class="drop-icon">📥</div>
        <div>松开即可播放本地视频文件</div>
    </div>

    <!-- 轻提示 -->
    <div id="toast"></div>

    <!-- 隐藏的文件选择框 -->
    <input type="file" id="image-file-input" accept="image/*" style="display:none">
    <input type="file" id="local-video-input"
           accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska,video/3gpp,video/3gpp2,video/x-msvideo,video/*"
           style="display:none">

    <script>
        // =========================
        // DOM 元素获取
        // =========================
        const videoUrlInput = document.getElementById('video-url-input');
        const loadVideoBtn = document.getElementById('load-video-btn');
        const localFileBtn = document.getElementById('local-file-btn');
        const localVideoInput = document.getElementById('local-video-input');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const toggleCameraBtn = document.getElementById('toggle-camera-btn');
        const mirrorVideoBtn = document.getElementById('mirror-video-btn');
        const mirrorCameraBtn = document.getElementById('mirror-camera-btn');
        const dropOverlay = document.getElementById('drop-overlay');
        const toastEl = document.getElementById('toast');

        const mainVideo = document.getElementById('main-video');
        const cameraWrapper = document.getElementById('camera-wrapper');
        const cameraVideo = document.getElementById('camera-video');
        const resizeHandle = document.getElementById('resize-handle');
        const embedContainer = document.getElementById('embed-container');
        const toggleImageBtn = document.getElementById('toggle-image-btn');
        const mirrorImageBtn = document.getElementById('mirror-image-btn');
        const imageFileInput = document.getElementById('image-file-input');
        const imageWrapper = document.getElementById('image-wrapper');
        const overlayImage = document.getElementById('overlay-image');

        let cameraStream = null;
        let videoMirror = false;
        let imageLoaded = false;
        let localObjectUrl = null;

        // =========================
        // 轻提示 Toast
        // =========================
        let toastTimer = null;
        function toast(msg, duration = 2600) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        // =========================
        // 开关型按钮状态切换
        // =========================
        function setToggleBtn(btn, on, onText, offText) {
            btn.classList.toggle('active', on);
            btn.classList.toggle('danger', on);
            btn.textContent = on ? onText : offText;
        }

        /* =========================
           解析 YouTube 视频 ID
        ========================= */
        function getYouTubeId(url) {
            try {
                const u = new URL(url);
                const host = u.hostname.toLowerCase();

                if (host === 'youtu.be') {
                    const id = u.pathname.slice(1).split('/')[0];
                    if (/^[A-Za-z0-9_-]{11}$/.test(id)) return id;
                    return null;
                }

                if (
                    host === 'youtube.com' ||
                    host === 'www.youtube.com' ||
                    host === 'm.youtube.com'
                ) {
                    if (u.pathname === '/watch') {
                        const v = u.searchParams.get('v');
                        if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return v;
                    }

                    const m = u.pathname.match(/\/(?:embed|shorts|v|live)\/([A-Za-z0-9_-]{11})/);
                    if (m) return m[1];
                }
            } catch (e) {}
            return null;
        }

        /* =========================
           解析 Bilibili 链接
           支持 BV 号和 av 号，支持 ?p=2 分P
        ========================= */
        function getBilibiliInfo(url) {
            try {
                const u = new URL(url);
                const host = u.hostname.toLowerCase();

                if (!host.includes('bilibili.com')) return null;

                const p = u.searchParams.get('p');
                let page = p ? parseInt(p, 10) : 1;
                if (!Number.isFinite(page) || page < 1) page = 1;

                let bvid = null;
                const bv = u.pathname.match(/\/video\/(BV[0-9A-Za-z]+)/);
                if (bv) bvid = bv[1];
                if (!bvid && u.searchParams.get('bvid')) {
                    bvid = u.searchParams.get('bvid');
                }

                let aid = null;
                const av = u.pathname.match(/\/video\/av(\d+)/);
                if (av) aid = parseInt(av[1], 10);
                if (!aid && u.searchParams.get('aid')) {
                    aid = parseInt(u.searchParams.get('aid'), 10);
                }

                if (!bvid && !aid) return null;
                return { bvid, aid, page };
            } catch (e) {
                return null;
            }
        }

        /* =========================
           解析 Vimeo 视频 ID
        ========================= */
        function getVimeoId(url) {
            try {
                const u = new URL(url);
                if (u.hostname.toLowerCase().includes('vimeo.com')) {
                    const m = u.pathname.match(/\/(\d+)/);
                    if (m) return m[1];
                }
            } catch (e) {}
            return null;
        }

        /* =========================
           显示嵌入播放器
        ========================= */
        function showEmbed(src, title) {
            mainVideo.pause();
            mainVideo.removeAttribute('src');
            mainVideo.load();
            mainVideo.style.display = 'none';

            embedContainer.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.src = src;
            iframe.title = title;
            iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';
            iframe.allowFullscreen = true;

            embedContainer.appendChild(iframe);
            embedContainer.style.display = 'block';

            applyVideoMirror();
        }

        /* =========================
           显示原生 video 播放器
        ========================= */
        function showDirect(url) {
            embedContainer.innerHTML = '';
            embedContainer.style.display = 'none';

            mainVideo.style.display = 'block';
            mainVideo.src = url;
            mainVideo.load();
            mainVideo.play().catch(e => console.log("自动播放被阻拦，需手动点击播放:", e));

            applyVideoMirror();
        }

        /* =========================
           视频镜像状态应用
        ========================= */
        function applyVideoMirror() {
            mainVideo.classList.toggle('video-mirror', videoMirror);

            const iframe = embedContainer.querySelector('iframe');
            if (iframe) {
                iframe.classList.toggle('video-mirror', videoMirror);
            }
        }

        /* =========================
           根据 URL 自动选择播放器
        ========================= */
        function loadVideo() {
            const url = videoUrlInput.value.trim();
            if (!url) {
                alert("请输入有效的视频地址");
                return;
            }

            // 1. YouTube
            const youtubeId = getYouTubeId(url);
            if (youtubeId) {
                showEmbed(
                    `https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}?rel=0&modestbranding=1&playsinline=1`,
                    "YouTube"
                );
                return;
            }

            // 2. Bilibili
            const bili = getBilibiliInfo(url);
            if (bili) {
                let src = "https://player.bilibili.com/player.html?";
                if (bili.bvid) {
                    src += `bvid=${encodeURIComponent(bili.bvid)}&`;
                } else {
                    src += `aid=${bili.aid}&`;
                }
                src += `page=${bili.page}&autoplay=1`;

                showEmbed(src, "Bilibili");
                return;
            }

            // 3. Vimeo
            const vimeoId = getVimeoId(url);
            if (vimeoId) {
                showEmbed(`https://player.vimeo.com/video/${vimeoId}`, "Vimeo");
                return;
            }

            // 4. 直接视频地址：MP4 / WebM / HLS 等
            if (/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)(\?|#|$)/i.test(url)) {
                showDirect(url);
                return;
            }

            // 5. 其他网址兜底：尝试 iframe 嵌入
            // 注意：很多网站会禁止被 iframe 嵌入，实际能否显示取决于目标网站策略
            showEmbed(url, "Web 页面");
        }

        loadVideoBtn.addEventListener('click', loadVideo);
        videoUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadVideo();
        });

        /* =========================
           本地视频文件加载
        ========================= */
        function loadLocalVideo() {
            const file = localVideoInput.files[0];
            if (!file) return;

            // 释放旧的对象 URL，避免内存泄漏
            if (localObjectUrl) {
                URL.revokeObjectURL(localObjectUrl);
                localObjectUrl = null;
            }

            // 创建对象 URL 并播放
            localObjectUrl = URL.createObjectURL(file);
            showDirect(localObjectUrl);
            toast("已加载本地视频：" + file.name);
        }

        localFileBtn.addEventListener('click', () => {
            localVideoInput.click();
        });

        localVideoInput.addEventListener('change', () => {
            loadLocalVideo();
            localVideoInput.value = '';
        });

        /* =========================
           拖拽本地视频文件
        ========================= */
        function handleDropFile(file) {
            if (!file || !file.type.startsWith('video/')) {
                toast("请拖入视频文件");
                return;
            }
            localVideoInput.files = [file];
            loadLocalVideo();
        }

        ['dragover', 'dragenter'].forEach(evt => {
            document.addEventListener(evt, (e) => {
                e.preventDefault();
                dropOverlay.style.display = 'flex';
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            document.addEventListener(evt, (e) => {
                e.preventDefault();
                dropOverlay.style.display = 'none';
            });
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            handleDropFile(file);
        });

        /* =========================
           摄像头开启 / 关闭
        ========================= */
        toggleCameraBtn.addEventListener('click', async () => {
            if (cameraWrapper.style.display === 'block') {
                // 关闭摄像头
                cameraWrapper.style.display = 'none';
                toggleCameraBtn.textContent = '开启摄像头';
                toggleCameraBtn.classList.remove('danger');
                toggleCameraBtn.classList.add('secondary');

                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    cameraStream = null;
                }
            } else {
                // 开启摄像头
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                    cameraVideo.srcObject = cameraStream;
                    cameraWrapper.style.display = 'block';

                    toggleCameraBtn.textContent = '关闭摄像头';
                    toggleCameraBtn.classList.remove('secondary');
                    toggleCameraBtn.classList.add('danger');
                } catch (err) {
                    alert("无法开启摄像头：" + err.message);
                }
            }
        });

        /* =========================
           镜像按钮
        ========================= */
        mirrorVideoBtn.addEventListener('click', () => {
            videoMirror = !videoMirror;
            applyVideoMirror();
        });

        mirrorCameraBtn.addEventListener('click', () => {
            cameraVideo.classList.toggle('camera-mirror');
        });

        /* =========================           悬浮 PNG 图片：上传 / 开关 / 镜像
        ========================= */
        toggleImageBtn.addEventListener('click', () => {
            if (imageLoaded) {
                // 已有图片：切换显示 / 隐藏
                if (imageWrapper.style.display === 'block') {
                    imageWrapper.style.display = 'none';
                    toggleImageBtn.textContent = '上传图片';
                    toggleImageBtn.classList.remove('danger');
                    toggleImageBtn.classList.add('secondary');
                } else {
                    imageWrapper.style.display = 'block';
                    toggleImageBtn.textContent = '隐藏图片';
                    toggleImageBtn.classList.remove('secondary');
                    toggleImageBtn.classList.add('danger');
                }
            } else {
                // 尚未上传：打开文件选择框
                imageFileInput.click();
            }
        });

        imageFileInput.addEventListener('change', () => {
            const file = imageFileInput.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert("仅支持图片格式文件");
                imageFileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                overlayImage.src = e.target.result;
                imageLoaded = true;
                imageWrapper.style.display = 'block';
                toggleImageBtn.textContent = '隐藏图片';
                toggleImageBtn.classList.remove('secondary');
                toggleImageBtn.classList.add('danger');
            };
            reader.readAsDataURL(file);
            imageFileInput.value = '';
        });

        mirrorImageBtn.addEventListener('click', () => {
            overlayImage.classList.toggle('image-mirror');
        });

        /* =========================
           悬浮图片窗口拖拽
        ========================= */
        let isImageDragging = false;
        let imgDragStartX = 0;
        let imgDragStartY = 0;
        let imgDragStartLeft = 0;
        let imgDragStartTop = 0;

        imageWrapper.addEventListener('mousedown', (e) => {
            isImageDragging = true;
            imgDragStartX = e.clientX;
            imgDragStartY = e.clientY;
            imgDragStartLeft = imageWrapper.offsetLeft;
            imgDragStartTop = imageWrapper.offsetTop;

            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isImageDragging) {
                const left = imgDragStartLeft + (e.clientX - imgDragStartX);
                const top = imgDragStartTop + (e.clientY - imgDragStartY);

                imageWrapper.style.left = left + 'px';
                imageWrapper.style.top = top + 'px';
            }
        });

        window.addEventListener('mouseup', () => {
            isImageDragging = false;
        });

        /* =========================           摄像头窗口拖拽
        ========================= */
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartLeft = 0;
        let dragStartTop = 0;

        cameraWrapper.addEventListener('mousedown', (e) => {
            if (e.target === resizeHandle) return;

            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragStartLeft = cameraWrapper.offsetLeft;
            dragStartTop = cameraWrapper.offsetTop;

            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const left = dragStartLeft + (e.clientX - dragStartX);
                const top = dragStartTop + (e.clientY - dragStartY);

                cameraWrapper.style.left = left + 'px';
                cameraWrapper.style.top = top + 'px';
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        /* =========================
           摄像头窗口右下角缩放
        ========================= */
        let isResizing = false;
        let resizeStartX = 0;
        let resizeStartY = 0;
        let resizeStartWidth = 0;
        let resizeStartHeight = 0;

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            resizeStartWidth = cameraWrapper.clientWidth;
            resizeStartHeight = cameraWrapper.clientHeight;

            e.preventDefault();
            e.stopPropagation();
        });

        window.addEventListener('mousemove', (e) => {
            if (isResizing) {
                const width = Math.max(150, resizeStartWidth + (e.clientX - resizeStartX));
                const height = Math.max(110, resizeStartHeight + (e.clientY - resizeStartY));

                cameraWrapper.style.width = width + 'px';
                cameraWrapper.style.height = height + 'px';
            }
        });

        window.addEventListener('mouseup', () => {
            isResizing = false;
        });
    </script>
</body>
</html>
